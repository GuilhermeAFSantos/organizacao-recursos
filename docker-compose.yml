# Banco de dados para DESENVOLVIMENTO LOCAL.
# Credenciais fixas e fracas de propósito: valem só para a sua máquina.
# Os testes NÃO usam este banco: cada execução sobe um PostgreSQL descartável via Testcontainers,
# com a mesma imagem (postgres:17-alpine) para que dev e testes se comportem igual.
services:
  postgres:
    image: postgres:17-alpine
    container_name: recursos-postgres
    environment:
      POSTGRES_DB: recursos
      POSTGRES_USER: recursos
      POSTGRES_PASSWORD: recursos
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - recursos-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recursos -d recursos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recursos-dados:
