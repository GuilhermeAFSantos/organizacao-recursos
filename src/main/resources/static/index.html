<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Organização de Recursos</title>
    <style>
        :root { --fundo: #f6f7f9; --texto: #1d2330; --suave: #5b6475; --destaque: #0b5cad; --cartao: #ffffff; }
        @media (prefers-color-scheme: dark) {
            :root { --fundo: #14171d; --texto: #e7eaf0; --suave: #a3abba; --destaque: #6aa8ff; --cartao: #1d2129; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: var(--fundo); color: var(--texto); line-height: 1.5; }
        main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
        h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
        p { color: var(--suave); margin: 0 0 24px; }
        .cartao { background: var(--cartao); border-radius: 12px; padding: 20px; margin-bottom: 12px;
                  box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
        a { color: var(--destaque); font-weight: 600; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<main>
    <h1>Organização de Recursos</h1>
    <p>Alocação de salas, professores e materiais sem conflitos de horário.</p>
    <div class="cartao">
        <a href="swagger-ui.html">Documentação da API (Swagger UI)</a>
    </div>
    <div class="cartao">
        <span>Interface de reservas: em construção (próximas fatias).</span>
    </div>
</main>
</body>
</html>
