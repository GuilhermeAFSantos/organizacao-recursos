# Perfil de DESENVOLVIMENTO LOCAL. Ativar com:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# Segredos NÃO ficam neste arquivo (SonarCloud java:S6437). Eles vêm do arquivo .env na raiz do
# projeto, que está no .gitignore. Para criar o seu: copie .env.exemplo para .env e troque os valores.
# O mesmo .env é lido pelo docker-compose, então banco e aplicação usam a mesma senha.
#
# Variáveis usadas (ver application.yml): DB_PASSWORD e JWT_SECRET (obrigatórias),
# DB_URL e DB_USER (opcionais; o padrão aponta para o PostgreSQL do docker-compose).
spring:
  config:
    import: optional:file:.env[.properties]
